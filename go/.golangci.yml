run:
  timeout: 5m
linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - misspell
    - depguard
linters-settings:
  depguard:
    rules:
      no-private-chain-module:
        deny:
          - pkg: github.com/parler-tech/sovr
            desc: "kit must not depend on the private chain module (FR-003/R3)"
          - pkg: github.com/parler-tech/sovr/app
            desc: "chain app drags libwasmvm CGO (R3)"
issues:
  exclude-use-default: true
